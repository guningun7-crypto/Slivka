name: Сборка Сказкосыск APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода игры
        uses: actions/checkout@v4

      - name: Настройка JDK 21 (требуется для AGP 9.1.1 и Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Принятие лицензий Android SDK (для автоматической загрузки SDK 36.1)
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Настройка Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Подготовка ключа подписи debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Сборка установочного файла Сказкосыск.apk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Переименование файла в Skazkosysk.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk Skazkosysk.apk

      - name: Публикация готового установщика Skazkosysk.apk
        uses: actions/upload-artifact@v4
        with:
          name: Skazkosysk-APK
          path: Skazkosysk.apk
