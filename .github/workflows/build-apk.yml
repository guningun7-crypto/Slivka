name: Сборка Сказкосыск APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода игры
        uses: actions/checkout@v4

      - name: Настройка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Генерация debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Сборка установочного файла Сказкосыск.apk
        run: gradle assembleDebug

      - name: Переименование файла в Skazkosysk.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk Skazkosysk.apk

      - name: Готовый установщик Skazkosysk.apk
        uses: actions/upload-artifact@v4
        with:
          name: Skazkosysk-APK
          path: Skazkosysk.apk
